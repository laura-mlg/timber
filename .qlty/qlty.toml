# This configuration was generated with the setup-qlty-toml skill.
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/build/**",
  "**/.gradle/**",
  "gradle/wrapper/**",
]

test_patterns = [
  "**/test/**",
  "**/androidTest/**",
  "**/*Test.kt",
  "**/*Test.java",
  "**/*Tests.kt",
  "**/*Tests.java",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# Language linters / formatters
[[plugin]]
name = "ktlint"
mode = "comment"

[[plugin]]
name = "google-java-format"
mode = "comment"

# Security scanners
[[plugin]]
name = "trufflehog"
mode = "block"

# Dependency vulnerability scanning
[[plugin]]
name = "osv-scanner"
mode = "monitor"

# Cross-language tools
[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"
